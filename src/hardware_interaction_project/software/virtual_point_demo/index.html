<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PYNQ-Z2 本机虚拟点测试</title>
<style>
*{box-sizing:border-box}body{font:16px system-ui,"Microsoft YaHei",sans-serif;margin:0;background:#f2f5f8;color:#19283b}main{max-width:1080px;margin:32px auto;padding:0 24px}h1{font-size:26px;margin:0 0 10px}p{line-height:1.6;color:#526174}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}button{padding:11px 18px;border:1px solid #aebbc9;border-radius:6px;background:white;color:#19283b;cursor:pointer}button:first-child{background:#155e66;color:white;border-color:#155e66}button:disabled{opacity:.5;cursor:default}label{display:flex;align-items:center;gap:7px;padding:8px}.bar{display:flex;justify-content:space-between;gap:15px;background:white;padding:14px 18px;border:1px solid #d5dfe9;border-bottom:0;border-radius:8px 8px 0 0}canvas{width:100%;display:block;aspect-ratio:16/9;background:#0d1d2e;border-radius:0 0 8px 8px}#state{font-weight:650}#coords{font-variant-numeric:tabular-nums}pre{font-size:13px;white-space:pre-wrap;word-break:break-all;padding:16px;background:white;border:1px solid #d5dfe9;border-radius:6px;line-height:1.6}.foot{font-size:13px}
</style>
<main><h1>PYNQ-Z2 本机虚拟点测试</h1>
<p>已选择 <strong>{{BACKEND_MODE}}</strong> 模式；目标板端地址 <code>{{BOARD_ADDRESS}}</code>。这是本机启动配置，协议未验证远端身份。</p>
<p>浏览器 → HostClient → 所配置的板端服务。输入始终为合成圆周信号，使用 <code>synthetic_linear_v1</code> 合成线性标定；仅绘制虚拟点，不代表真实眼动，不操作系统鼠标。</p>
<div class="toolbar"><button id="connect">连接新会话</button><button id="start">开始合成输入</button><button id="pause">暂停输入</button><button id="disconnect">断开连接</button><label><input id="invalid" type="checkbox">输入无效 valid=0</label></div>
<div class="bar"><span id="state">未连接</span><span id="coords">无可用坐标</span></div>
<canvas id="canvas" width="1920" height="1080" aria-label="虚拟屏幕，只有新鲜且成功的响应才绘点"></canvas>
<pre id="details">会话：无
帧号：无
等待显式连接。</pre><p class="foot">屏幕范围 1920 × 1080 · 结果 TTL 500 ms · 单请求在途 · 暂停立即清除旧点 · 空闲 5 秒会断连，需重新连接并开始输入 · 不重放积压输入</p></main>
<script src="/app.js"></script></html>
